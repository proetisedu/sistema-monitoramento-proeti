<!DOCTYPE html>
<html lang="pt-br">

        #tela_login { max-width: 400px; margin: 80px auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); display: none; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .tab-btn { padding: 10px 20px; cursor: pointer; border: none; background: #e9ecef; border-radius: 5px; font-weight: bold; }
        .tab-btn.active { background: var(--primary); color: white; }
        .card-saldos { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; background: var(--dark); padding: 20px; border-radius: 10px; color: white; margin: 20px 0; }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
        .full-width { grid-column: 1 / -1; }
        .hidden { display: none; }
        label { font-size: 11px; font-weight: bold; color: #666; text-transform: uppercase; margin-bottom: 5px; display: block; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .saldo-final { background: var(--primary); padding: 10px; border-radius: 5px; font-weight: bold; font-size: 1.4em; text-align: center; border: 2px solid #fff; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
        table th { background: #f8f9fa; padding: 10px; text-align: left; border-bottom: 2px solid #dee2e6; }
        table td { padding: 10px; border-bottom: 1px solid #eee; }
        .btn { padding: 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.3s; }
        .btn-add { background: var(--success); color: white; width: 100%; margin-top: 10px; }
        .btn-save { background: var(--primary); color: white; width: 100%; margin-top: 30px; font-size: 16px; }
        .painel-controle { background: #fff3cd; padding: 15px; border-radius: 8px; margin: 10px 0; border: 1px solid #ffeeba; font-weight: bold; color: #856404; }
        .detalhes-ocultos { display: none; padding: 10px; background: #f9f9f9; border-top: 1px solid #eee; font-size: 12px; }
        .item-historico { border: 1px solid #ddd; margin-bottom: 8px; border-radius: 5px; overflow: hidden; }
        .header-item { padding: 12px; background: #fff; cursor: pointer; display: flex; justify-content: space-between; }
    </style>
</head>

    function verificarToken() {
        const tokenDigitado = document.getElementById('codigo_acesso').value.toUpperCase().trim();
        const tokenEncontrado = tokensMunicipios.find(t => t.codigo === tokenDigitado);

        if (tokenEncontrado) {
            const nomeMuniNorm = tokenEncontrado.nome.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            const editaisDisponiveis = bancoUsuarios.filter(u => u.municipio === nomeMuniNorm);

            if (editaisDisponiveis.length === 0) return alert("Município validado, mas nenhum edital encontrado.");

            const select = document.getElementById('selecao_edital');
            select.innerHTML = "";
            editaisDisponiveis.forEach(e => {
                let opt = document.createElement('option');
                opt.value = JSON.stringify(e);
                opt.innerHTML = `Edital ${e.edital}`;
                select.appendChild(opt);
            });

            document.getElementById('label_municipio').innerHTML = `Município: <b>${tokenEncontrado.nome}</b>`;
            document.getElementById('etapa_1').classList.add('hidden');
            document.getElementById('etapa_2').classList.remove('hidden');
        } else {
            alert("Token inválido!");
        }
    }

    function finalizarLogin() {
        const dados = JSON.parse(document.getElementById('selecao_edital').value);
        municipioLogado = dados;
        document.getElementById('tela_login').style.display = 'none';
        document.getElementById('sistema_principal').style.display = 'block';
        document.getElementById('m_edital').value = dados.edital;
        document.getElementById('m_municipio').value = dados.municipio;
        renderHistorico();
    }

    function parseMoney(v) { return parseFloat(v.replace(/[R$\s.]/g,'').replace(',','.')) || 0; }
    function formatMoney(n) { return "R$ " + n.toLocaleString('pt-BR',{minimumFractionDigits:2}); }
    function validarLogica() { const dif = (parseMoney(document.getElementById('s_anterior').value) + parseMoney(document.getElementById('s_repasses').value) + parseMoney(document.getElementById('s_rendimentos').value)) - parseMoney(document.getElementById('s_atual').value); document.getElementById('v_gastos_display').innerText = formatMoney(dif > 0.01 ? dif : 0); document.getElementById('area_despesas').style.display = (dif > 0.01) ? 'block' : 'none'; atualizarPainelControle(); }
    function atualizarPainelControle() { const totalParaGastar = parseMoney(document.getElementById('v_gastos_display').innerText); const totalJaLancado = listaDespesas.reduce((soma, item) => soma + parseMoney(item.valor), 0); const restante = totalParaGastar - totalJaLancado; const el = document.getElementById('saldo_restante_label'); el.innerText = formatMoney(restante); el.style.color = (restante < -0.01) ? 'red' : (Math.abs(restante) < 0.01 ? 'green' : '#856404'); }
    function toggleNFVinculada() { document.getElementById('div_nf_vinc').classList.toggle('hidden', document.getElementById('f_tipo_doc').value !== "GUIA DE IMPOSTO"); }
    function atualizarNatureza() { const sel = document.getElementById('f_class'); document.getElementById('f_natureza').value = sel.options[sel.selectedIndex].parentNode.label || ""; }
    function adicionarGasto() { const valorNovoGasto = parseMoney(document.getElementById('f_valor').value); const totalParaGastar = parseMoney(document.getElementById('v_gastos_display').innerText); const totalJaLancado = listaDespesas.reduce((soma, item) => soma + parseMoney(item.valor), 0); if ((totalJaLancado + valorNovoGasto) > (totalParaGastar + 0.01)) return alert("ERRO: Valor supera o saldo disponível!"); const item = { forn: document.getElementById('f_fornecedor').value, cnpj: document.getElementById('f_cnpj_fav').value, tipo_doc: document.getElementById('f_tipo_doc').value, nf_vinc: document.getElementById('f_nf_vinc').value, num_doc: document.getElementById('f_num_doc').value, data_doc: document.getElementById('f_data_doc').value, classificacao: document.getElementById('f_class').value, natureza: document.getElementById('f_natureza').value, ob: document.getElementById('f_ob').value, data_pgto: document.getElementById('f_data_pgto').value, valor: document.getElementById('f_valor').value }; if(!item.forn || !item.natureza || item.valor === "R$ 0,00") return alert("Preencha os campos!"); listaDespesas.push(item); renderTabela(); document.getElementById('f_fornecedor').value = ""; document.getElementById('f_cnpj_fav').value = ""; document.getElementById('f_tipo_doc').selectedIndex = 0; document.getElementById('f_num_doc').value = ""; document.getElementById('f_data_doc').value = ""; document.getElementById('f_class').selectedIndex = 0; document.getElementById('f_natureza').value = ""; document.getElementById('f_ob').value = ""; document.getElementById('f_data_pgto').value = ""; document.getElementById('f_valor').value = "R$ 0,00"; document.getElementById('div_nf_vinc').classList.add('hidden'); atualizarPainelControle(); }
    function renderTabela() { document.querySelector('#tabela_gastos tbody').innerHTML = listaDespesas.map((d, i) => `<tr><td>${i+1}</td><td>${d.forn}</td><td>${d.natureza}</td><td>${d.valor}</td><td><button onclick="listaDespesas.splice(${i},1);renderTabela();atualizarPainelControle()">X</button></td></tr>`).join(''); }
    function formatarMoeda(valor) { let v = parseFloat(valor.toString().replace(/[R$\s.]/g,'').replace(',','.')); return isNaN(v) ? valor : "R$ " + v.toLocaleString('pt-BR', {minimumFractionDigits: 2}); }
    function gerarPDF() { const { jsPDF } = window.jspdf; const doc = new jsPDF('l', 'mm', 'a4'); doc.setFontSize(20); doc.setTextColor(0, 86, 179); doc.text("PROETI - ES | Relatório de Monitoramento Mensal", 148, 15, { align: 'center' }); doc.setFontSize(12); doc.setTextColor(0, 0, 0); doc.text(`Município: ${document.getElementById('m_municipio').value}`, 14, 30); doc.text(`Edital: ${document.getElementById('m_edital').value}`, 14, 37); doc.text(`Mês de Referência: ${document.getElementById('m_mes').value}`, 14, 44); doc.setFontSize(14); doc.text("Resumo Financeiro", 14, 55); doc.setFontSize(10); doc.rect(14, 58, 267, 15); doc.text(`Saldo Anterior: ${document.getElementById('s_anterior').value}`, 16, 64); doc.text(`Repasses: ${document.getElementById('s_repasses').value}`, 80, 64); doc.text(`Rendimentos: ${document.getElementById('s_rendimentos').value}`, 150, 64); doc.text(`Saldo Atual: ${document.getElementById('s_atual').value}`, 220, 64); const columns = ["Fornecedor", "CNPJ", "Tipo Doc", "NF Vinc", "Nº Doc", "Data Doc", "Natureza", "OB", "Data Pgto", "Valor"]; const data = listaDespesas.map(d => [d.forn, d.cnpj, d.tipo_doc, d.nf_vinc, d.num_doc, d.data_doc, d.natureza, d.ob, d.data_pgto, d.valor]); doc.autoTable({ startY: 78, head: [columns], body: data, theme: 'striped', headStyles: { fillColor: [0, 86, 179] }, styles: { fontSize: 8, cellPadding: 2 } }); doc.text(`Gerado em: ${new Date().toLocaleString()} - Sistema de Monitoramento PROETI ES`, 14, 200); doc.save(`Monitoramento_${document.getElementById('m_municipio').value}_${document.getElementById('m_mes').value}.pdf`); }
    function prepararEnvio() { const mes = document.getElementById('m_mes').value; if(!mes) return alert("Selecione o mês!"); gerarPDF(); const payload = { edital: document.getElementById('m_edital').value, municipio: municipioLogado.municipio, mes: mes, totais: { anterior: document.getElementById('s_anterior').value, repasses: document.getElementById('s_repasses').value, rendimentos: document.getElementById('s_rendimentos').value, atual: document.getElementById('s_atual').value }, itens: listaDespesas }; fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) }).then(() => { alert("Enviado com sucesso!"); location.reload(); }).catch(err => { console.error(err); alert("Erro ao enviar."); }); }
    function renderHistorico() { fetch(SCRIPT_URL).then(res => res.json()).then(dados => { let meuHistorico = dados.filter(x => x.municipio === municipioLogado.municipio); let grupos = {}; meuHistorico.forEach(x => { if (!grupos[x.mes]) grupos[x.mes] = { edital: x.edital, anterior: x.anterior, repasses: x.repasses, rendimentos: x.rendimentos, atual: x.atual, itens: [] }; grupos[x.mes].itens.push(x); }); const container = document.getElementById('lista_historico'); container.innerHTML = ordemMeses.filter(mes => grupos[mes]).map((mes, i) => { let grupo = grupos[mes]; let totalDespesas = grupo.itens.reduce((soma, it) => soma + parseFloat(it.valor.toString().replace(/[R$\s.]/g,'').replace(',','.') || 0), 0); let tabelaItens = grupo.itens.map(it => `<tr style="font-size:11px;"><td>${it.forn}</td><td>${it.natureza}</td><td>${it.tipo_doc}</td><td>${it.num_doc}</td><td>${it.ob}</td><td>${formatarMoeda(it.valor)}</td></tr>`).join(''); return `<div class="item-historico"><div class="header-item" onclick="toggleDetalhes(${i})" style="background:#e9ecef; border-bottom:1px solid #ccc; display: flex; flex-wrap: wrap; gap: 10px;"><span style="width: 100%;"><b>${mes}</b> - Edital ${grupo.edital}</span><div style="font-size:10px; font-weight:normal;"><b>Saldo Ant:</b> ${formatarMoeda(grupo.anterior)} | <b>Repasses:</b> ${formatarMoeda(grupo.repasses)} | <b>Rendimentos:</b> ${formatarMoeda(grupo.rendimentos)} | <b>Saldo Atual:</b> ${formatarMoeda(grupo.atual)} | <b>Total Desp:</b> ${formatarMoeda(totalDespesas)}</div></div><div id="detalhes_${i}" class="detalhes-ocultos"><table style="width:100%; border-collapse:collapse; margin-top:5px;"><thead><tr style="background:#eee; font-size:10px;"><th>Fornecedor</th><th>Natureza</th><th>Tipo</th><th>N° Doc</th><th>OB</th><th>Valor</th></tr></thead><tbody>${tabelaItens}</tbody></table></div></div>`; }).join(''); }); }
    function toggleDetalhes(id) { const el = document.getElementById('detalhes_' + id); el.style.display = (el.style.display === 'block') ? 'none' : 'block'; }
    document.getElementById('f_cnpj_fav').addEventListener('input', function (e) { let v = e.target.value.replace(/\D/g, ""); v = v.replace(/^(\d{2})(\d)/, "$1.$2").replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3").replace(/\.(\d{3})(\d)/, ".$1/$2").replace(/(\d{4})(\d)/, "$1-$2"); e.target.value = v.substring(0, 18); });
    document.querySelectorAll('.moeda').forEach(input => { input.addEventListener('input', e => { let v = e.target.value.replace(/\D/g,''); v = (v/100).toFixed(2).replace(".",",").replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1."); e.target.value = "R$ " + v; validarLogica(); atualizarPainelControle(); }); });
</script>
